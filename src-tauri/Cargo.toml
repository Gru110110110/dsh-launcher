[package]
name = "dsh-launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
dsh-core = { path = "../crates/dsh-core" }
fs2.workspace = true
log.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.7"
tauri-plugin-single-instance = "2"
# Pinned to a minor series: `UpdaterBuilder::configure_client` exposes the
# plugin's reqwest 0.13 ClientBuilder type, which can change across plugin
# minor versions.
tauri-plugin-updater = "~2.10.1"
tokio = { version = "1", features = ["time"] }
url.workspace = true
# Alias for the updater plugin's reqwest 0.13: feature unification enables
# socks and system-proxy for updater checks and downloads, and the shared
# version keeps the `configure_client` ClientBuilder type identical.
reqwest-updater = { package = "reqwest", version = "0.13", default-features = false, features = ["socks", "system-proxy"] }

[dev-dependencies]
tempfile.workspace = true
