[workspace]
members = ["crates/dsh-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/Gru110110110/deepseek-harness-desktop-launcher"
rust-version = "1.96"

[workspace.dependencies]
base64 = "0.22"
dirs = "6.0"
fs2 = "0.4"
flate2 = "1.1"
hex = "0.4"
libc = "0.2"
log = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots", "socks", "system-proxy"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sys-locale = "0.3"
tar = "0.4"
tempfile = "3.22"
thiserror = "2.0"
time = { version = "0.3.55", features = ["formatting"] }
ts-rs = { version = "11.1", features = ["serde-compat"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
walkdir = "2.5"
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "5.1", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
