name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
            paths: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Configure isolated data homes
        shell: bash
        run: |
          echo "DSH_DESKTOP_HOME=$RUNNER_TEMP/dsh-desktop-tests" >> "$GITHUB_ENV"
          echo "DSH_HOME=$RUNNER_TEMP/dsh-home-tests" >> "$GITHUB_ENV"
          echo "DSH_DESKTOP_SOURCE_HOME=$RUNNER_TEMP/dsh-source-home-tests" >> "$GITHUB_ENV"
          echo "DSH_DESKTOP_CC_SWITCH_HOME=$RUNNER_TEMP/cc-switch-home-tests" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-${{ matrix.target }}
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows-specific regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = @(& cargo test -p dsh-core --lib --target ${{ matrix.target }} `
            windows_ -- --nocapture 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $detail = (($output | Select-Object -Last 80) -join "`n") `
              -replace '%', '%25' `
              -replace "`r", '%0D' `
              -replace "`n", '%0A'
            Write-Host "::error title=Windows-specific regression test failed::$detail"
            exit $exitCode
          }
      - name: Verify macOS-specific regressions
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          cargo test -p dsh-core --lib --target ${{ matrix.target }} \
            process_recovery::tests:: -- --nocapture
      - name: Require the Tauri updater trust root
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY"
          node scripts/write-release-config.mjs "$RUNNER_TEMP/tauri.release.json"
      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          retryAttempts: 3
          args: --config "${{ runner.temp }}/tauri.release.json" --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Require the Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $executable = "target/${{ matrix.target }}/release/dsh-launcher.exe"
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          $peHeader = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $optionalHeader = $peHeader + 24
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $optionalHeader + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), found $subsystem"
          }
      - name: Require signed updater artifacts
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            installers=(target/${{ matrix.target }}/release/bundle/nsis/*.exe)
            signatures=(target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig)
            test "${#installers[@]}" -gt 0
            test "${#signatures[@]}" -eq "${#installers[@]}"
          else
            dmgs=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
            archives=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz)
            signatures=(target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig)
            test "${#dmgs[@]}" -gt 0
            test "${#archives[@]}" -gt 0
            test "${#signatures[@]}" -eq "${#archives[@]}"
          fi

      - name: Smoke installed Windows package
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-ProcessWithTimeout {
            param(
              [Parameter(Mandatory)] [string] $Label,
              [Parameter(Mandatory)] [string] $FilePath,
              [string[]] $ArgumentList = @(),
              [Parameter(Mandatory)] [int] $TimeoutSeconds
            )

            Write-Host "::group::$Label"
            try {
              Write-Host "Starting $FilePath $($ArgumentList -join ' ')"
              $process = Start-Process `
                -FilePath $FilePath `
                -ArgumentList $ArgumentList `
                -NoNewWindow `
                -PassThru

              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                Write-Host "Process tree at timeout:"
                Get-CimInstance Win32_Process |
                  Where-Object { $_.ProcessId -eq $process.Id -or $_.ParentProcessId -eq $process.Id } |
                  Select-Object ProcessId, ParentProcessId, Name, CommandLine |
                  Format-Table -AutoSize |
                  Out-Host
                & taskkill.exe /PID $process.Id /T /F | Out-Host
                throw "$Label exceeded its ${TimeoutSeconds}s timeout"
              }

              if ($process.ExitCode -ne 0) {
                throw "$Label failed with exit code $($process.ExitCode)"
              }
              Write-Host "$Label completed"
            } finally {
              Write-Host "::endgroup::"
            }
          }

          $installers = @(Get-ChildItem `
            -Path "target/${{ matrix.target }}/release/bundle/nsis/*.exe" `
            -File)
          if ($installers.Count -ne 1) {
            throw "Expected one NSIS installer, found $($installers.Count)"
          }

          $installRoot = Join-Path $env:RUNNER_TEMP "dsh-installer-smoke"
          New-Item -ItemType Directory -Path $installRoot -Force | Out-Null
          Invoke-ProcessWithTimeout `
            -Label "Install NSIS package" `
            -FilePath $installers[0].FullName `
            -ArgumentList @("/S", "/D=$installRoot") `
            -TimeoutSeconds 180

          $executables = @(Get-ChildItem `
            -Path $installRoot `
            -Filter "dsh-launcher.exe" `
            -File `
            -Recurse)
          if ($executables.Count -ne 1) {
            throw "Expected one installed launcher, found $($executables.Count)"
          }

          Invoke-ProcessWithTimeout `
            -Label "Read installed launcher version" `
            -FilePath $executables[0].FullName `
            -ArgumentList @("--desktop-version") `
            -TimeoutSeconds 30
          Invoke-ProcessWithTimeout `
            -Label "Check installed launcher" `
            -FilePath $executables[0].FullName `
            -ArgumentList @("--check") `
            -TimeoutSeconds 30

          $uninstallers = @(Get-ChildItem `
            -Path $installRoot `
            -Filter "uninstall.exe" `
            -File `
            -Recurse)
          if ($uninstallers.Count -ne 1) {
            throw "Expected one uninstaller, found $($uninstallers.Count)"
          }
          Invoke-ProcessWithTimeout `
            -Label "Uninstall NSIS package" `
            -FilePath $uninstallers[0].FullName `
            -ArgumentList @("/S") `
            -TimeoutSeconds 60

      - name: Smoke installed macOS package
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        timeout-minutes: 3
        run: |
          shopt -s nullglob
          dmg=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          mount_point="$RUNNER_TEMP/dsh-dmg-smoke"
          mkdir -p "$mount_point"
          cleanup() { hdiutil detach "$mount_point" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "${dmg[0]}"
          app_bundle="$(find "$mount_point" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          executable="$(find "$mount_point" -path '*/Contents/MacOS/dsh-launcher' -type f -print -quit)"
          test -n "$executable"
          "$executable" --desktop-version
          "$executable" --check
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-launcher-${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  verify-release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-launcher-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
      - name: Stage and upload the complete draft release
        run: |
          node scripts/stage-release-assets.mjs "$RUNNER_TEMP/release-artifacts" "$RUNNER_TEMP/release-assets"
          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ -n "$release_state" && "$release_state" != "true" ]]; then
            echo "Refusing to replace a published release" >&2
            exit 1
          fi
          if [[ "$release_state" == "true" ]]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "DSH Launcher v${GITHUB_REF_NAME#desktop-v}" \
            --notes "See the repository changelog and installation guide for this release."
          assets=("$RUNNER_TEMP/release-assets/"*)
          test "${#assets[@]}" -gt 0
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}"
      - name: Create and upload the complete updater manifest
        run: |
          mkdir -p "$RUNNER_TEMP/generated-manifest"
          node scripts/create-updater-manifest.mjs "$RUNNER_TEMP/release-artifacts" "$RUNNER_TEMP/generated-manifest/latest.json"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/generated-manifest/release-assets.json"
          node scripts/check-updater-manifest.mjs "$RUNNER_TEMP/generated-manifest/latest.json" "$RUNNER_TEMP/generated-manifest/release-assets.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/generated-manifest/latest.json" --clobber
      - name: Verify the uploaded updater manifest
        run: |
          mkdir -p "$RUNNER_TEMP/updater-manifest"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP/updater-manifest"
          gh release view "$GITHUB_REF_NAME" --json assets > "$RUNNER_TEMP/updater-manifest/release-assets.json"
          node scripts/check-updater-manifest.mjs "$RUNNER_TEMP/updater-manifest/latest.json" "$RUNNER_TEMP/updater-manifest/release-assets.json"
      - name: Publish the verified release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
